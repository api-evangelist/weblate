        * `catkeys` - Haiku catkeys

        * `cmp-resource` - Compose Multiplatform Resource

        * `csv` - CSV file

        * `csv-multi` - Multivalue CSV file

        * `csv-simple` - Simple CSV file

        * `dokuwiki` - DokuWiki text file

        * `dtd` - DTD file

        * `flatxml` - Flat XML file

        * `fluent` - Fluent file

