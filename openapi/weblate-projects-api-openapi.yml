components:
  schemas:
    ColorEnum:
      enum:
      - navy
      - blue
      - aqua
      - teal
      - olive
      - green
      - lime
      - yellow
      - orange
      - red
      - maroon
      - fuchsia
      - purple
      - black
      - gray
      - silver
      type: string
      description: '* `navy` - Navy

        * `blue` - Blue

        * `aqua` - Aqua

        * `teal` - Teal

        * `olive` - Olive

        * `green` - Green

        * `lime` - Lime

        * `yellow` - Yellow

        * `orange` - Orange

        * `red` - Red

        * `maroon` - Maroon

        * `fuchsia` - Fuchsia

        * `purple` - Purple

        * `black` - Black

        * `gray` - Gray

        * `silver` - Silver'
    ErrorResponse404:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ClientErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error404'
      required:
      - errors
      - type
    ErrorResponse415:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ClientErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error415'
      required:
      - errors
      - type
    PaginatedAnnouncementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
    Error401:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode401Enum'
        detail:
          type: string
        attr:
          type:
          - string
          - 'null'
      required:
      - attr
      - code
      - detail
    FileFormatEnum:
      enum:
      - apple-xliff
      - appstore
      - arb
      - aresource
      - asciidoc
      - ass
      - catkeys
      - cmp-resource
      - csv
      - csv-multi
      - csv-simple
      - dokuwiki
      - dtd
      - flatxml
      - fluent
      - formatjs
      - go-i18n-json
