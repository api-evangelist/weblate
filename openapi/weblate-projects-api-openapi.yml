      - go-i18n-toml
      - gotext
      - gwt
      - html
      - i18next
      - i18nextv4
      - idml
      - ini
      - islu
      - joomla
      - json
      - json-nested
      - laravel
      - markdown
      - mdx
      - mediawiki
      - mi18n-lang
      - moko-resource
      - nextcloud-json
      - odf
      - php
      - plainxliff
      - po
      - po-mono
      - poxliff
      - properties
      - rc
