    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        message:
          type: string
          description: You can use Markdown and mention users by @username.
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          description: 'Severity defines color used for the message.


            * `info` - Info (light blue)

            * `warning` - Warning (yellow)

            * `danger` - Danger (red)

            * `success` - Success (green)'
        expiry:
          type:
          - string
          - 'null'
          format: date
          title: Expiry date
          description: The message will be not shown after this date. Use it to announce string freeze and translation deadline for next release.
        notify:
          type: boolean
          title: Notify users
          description: Send notification to subscribed users.
      required:
      - id
      - message
    ErrorCode406Enum:
      enum:
      - not_acceptable
      type: string
      description: '* `not_acceptable` - Not Acceptable'
    Error423:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode423Enum'
        detail:
          type: string
        attr:
